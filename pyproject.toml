[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "provision-extraction"
version = "0.1.0"
description = "LangGraph-based extraction of IRS provisions from bills/documents"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["provision_extraction*", "provision_graph*", "local*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
